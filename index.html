<body>
<section id="login">
 <div id="loginCard">
  <div class="login-brand">PassVault <span class="brand-version" id="loginVersion"></span></div>
  <p>電腦看板管理、手機唯讀搜尋。GitHub 只儲存程式；密碼庫由你手動選擇，於瀏覽器內解密。</p>
  <div class="entry-actions">
   <label class="upload-label">開啟加密密碼庫（.pvault）<input id="vaultInput" type="file" accept=".pvault,application/json"></label>
   <label class="upload-label">匯入 .HTML（舊版／加密備份）<input id="htmlInput" type="file" accept=".html,text/html"></label>
   <button id="newVault" class="btn">建立空白密碼庫</button>
  </div>
  <div id="unlockArea" class="hidden">
   <div class="passline"><input type="password" id="masterInput" placeholder="請輸入主密碼" autocomplete="off"><button id="unlockBtn" class="btn primary">解鎖</button></div>
  </div>
  <p id="loginStatus" class="small" aria-live="polite"></p>
  <p class="small">主密碼無法從備份檔案找回；請妥善保存。</p>
  <details class="release-note"><summary>版本資訊</summary><p>PC 恢復 v7.1 看板與資料夾管理；手機沿用 v2.0 唯讀介面；可匯出加密 .pvault 與加密單檔 HTML。</p></details>
 </div>
</section>
<section id="app" class="hidden">
 <header class="header">
  <div class="brand">PassVault <span class="brand-version" id="appVersion"></span><span class="mode" id="modeLabel"></span></div>
  <div class="search-wrap"><span class="search-glyph">⌕</span><input id="search" type="search" placeholder="搜尋標題、帳號、備註"><button id="backBtn" class="back-btn" aria-label="返回分類" title="返回分類"><svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg></button></div>
  <div class="actions">
   <button id="addItem" class="btn desktop-only">＋ 新增帳密</button>
   <button id="addFolder" class="btn desktop-only">＋ 新資料夾</button>
   <label class="btn desktop-only" style="cursor:pointer">匯入 TXT<input id="txtInput" type="file" accept=".txt" multiple hidden></label>
   <label class="btn desktop-only" style="cursor:pointer">讀取 HTML<input id="htmlInputPC" type="file" accept=".html,text/html" hidden></label>
   <button id="csvBtn" class="btn desktop-only">Excel (CSV)</button>
   <button id="htmlExportBtn" class="btn desktop-only">加密 HTML</button>
   <button id="exportBtn" class="btn primary desktop-only">匯出 .pvault</button>
   <button id="lockBtn" class="btn">鎖定</button>
  </div>
 </header>
 <main class="workspace">
  <aside id="uncatColumn" class="uncat" data-folder-id="uncategorized"><div class="uncat-head"><span>未分類 <span id="uncatPending"></span></span><span id="uncatCount" class="folder-count">0</span></div><div id="uncatItems" class="uncat-items"></div><div class="vault-info"><div><strong id="vaultName">未命名</strong></div><div>最後更新：<span id="lastModified">—</span></div><div>狀態：<strong id="saveState">—</strong></div></div></aside>
  <div class="board-area"><div id="desktopBoard" class="board"></div></div>
 </main>
 <main id="mobilePage" class="mobile-page view-folders"><section class="mobile-folders"><div class="uncat-head" style="border:0">分類</div><div id="mobileFolders"></div></section><section class="mobile-list"><div id="mobileCount" class="mstatus"></div><div id="mobileItems"></div></section><section class="mobile-detail" id="mobileDetail"></section></main>
 <nav class="mobile-tabs"><button data-tab="folders" class="active">分類</button><button data-tab="list">帳號</button><button data-tab="detail">詳細</button></nav>
</section>
<div id="modal" class="modal hidden"><div id="modalBody" class="modal-card"></div></div>
<div id="toast" class="float-toast" role="status" aria-live="polite"></div>
<!-- This slot contains only AES-GCM ciphertext, never plaintext passwords. -->
<script id="embedded-vault" type="application/json"></script>
<script>
'use strict';
const APP_VERSION='2.1', SCHEMA_VERSION=1, MOBILE_BREAKPOINT=900;
const encoder=new TextEncoder(),decoder=new TextDecoder();
const $=id=>document.getElementById(id), esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Capture pristine markup before password data can ever populate the DOM.
// Never use the live unlocked DOM as an HTML backup source.
const CLEAN_SOURCE='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
const IS_MOBILE_DEVICE=/iPhone|iPad|iPod|Android|Mobile/i.test(navigator.userAgent+' '+navigator.platform)||(/Mac/.test(navigator.platform+' '+navigator.userAgent)&&navigator.maxTouchPoints>1);
let vault=null, selectedId=null, currentFolder='all', focusedFolder=null, dirty=false, postExport=false, masterPassword='', selectedFilename='尚未命名', incoming=null, drag=null;
let readonlyMode=IS_MOBILE_DEVICE;
let currentTab='folders', hiddenAt=null, revealTimer=null, draft=null, changedSinceOpen=false;
let sessionEpoch=0,exportBusy=false,pendingSave=null,masterPromptResolve=null,backgroundTimer=null,exportSequence=0;
const COLORS=['#60a5fa','#a78bfa','#f472b6','#fbbf24','#34d399','#2dd4bf','#fde047','#94a3b8'];
function stamp(){return new Date().toISOString()}
function uid(){return typeof crypto.randomUUID==='function'?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2)}
function fileStamp(){const d=new Date();const two=n=>String(n).padStart(2,'0');return `${d.getFullYear()}${two(d.getMonth()+1)}${two(d.getDate())}_${two(d.getHours())}${two(d.getMinutes())}${two(d.getSeconds())}_${String(d.getMilliseconds()).padStart(3,'0')}_${++exportSequence}_${uid().slice(-8)}`}
function b64(bytes){let s='';for(const b of bytes)s+=String.fromCharCode(b);return btoa(s)}
function unb64(s){if(typeof s!=='string'||!/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(s))throw Error('Base64 格式不正確');return Uint8Array.from(atob(s),x=>x.charCodeAt(0))}
function statusText(msg,bad=false){$('loginStatus').textContent=msg;$('loginStatus').className='small '+(bad?'bad':'good')}
function notify(s){let t=$('toast');t.textContent=s;t.classList.add('show');clearTimeout(t._hide);t._hide=setTimeout(()=>t.classList.remove('show'),2300)}
function setVersion(){document.title='PassVault v'+APP_VERSION;$('loginVersion').textContent='v'+APP_VERSION;$('appVersion').textContent='v'+APP_VERSION}
function modeMobile(){return readonlyMode}
function emptyVault(){return{schemaVersion:SCHEMA_VERSION,appVersion:APP_VERSION,createdAt:stamp(),updatedAt:stamp(),folders:[{id:'personal',name:'個人帳號',color:COLORS[1]},{id:'web',name:'網站帳號',color:COLORS[0]}],items:[]}}
function ensureUncat(f){if(!f.some(x=>x.id==='uncategorized'))f.unshift({id:'uncategorized',name:'未分類',color:COLORS[7]})}
function isRecord(value){return value!==null&&typeof value==='object'&&!Array.isArray(value)}
function textField(value,key,fallback=''){if(value[key]===undefined||value[key]===null)return fallback;if(typeof value[key]!=='string')throw Error('密碼庫文字欄位型別不正確');return value[key]}
function normalize(data){
 if(!isRecord(data)||data.schemaVersion!==SCHEMA_VERSION||!Array.isArray(data.items)||!Array.isArray(data.folders))throw Error('密碼庫資料格式或版本不正確');
 const copy=structuredClone(data);copy.schemaVersion=SCHEMA_VERSION;copy.appVersion=APP_VERSION;copy.createdAt=textField(copy,'createdAt',stamp());copy.updatedAt=textField(copy,'updatedAt',stamp());
 const folderSeen=new Set();copy.folders=copy.folders.map((f,index)=>{if(!isRecord(f))throw Error('分類格式不正確');const id=textField(f,'id')||uid();if(id==='all'||folderSeen.has(id))throw Error('分類 ID 重複或無效');folderSeen.add(id);return {...f,id,name:textField(f,'name','未命名'),color:COLORS.includes(f.color)?f.color:COLORS[index%COLORS.length],collapsed:!!f.collapsed}});ensureUncat(copy.folders);
 const folderIds=new Set(copy.folders.map(f=>f.id));const seen=new Set();
 copy.items=copy.items.map((x,index)=>{
   if(!isRecord(x))throw Error('帳密格式不正確');const id=textField(x,'id')||uid();if(seen.has(id))throw Error('密碼庫存在重複帳密 ID');seen.add(id);
   const folderId=textField(x,'folderId')||'uncategorized';if(!folderIds.has(folderId)||x.isDraft===true)throw Error('帳密分類不存在或包含未完成草稿');
   return {...x,id,title:textField(x,'title'),account:textField(x,'account'),password:textField(x,'password'),notes:textField(x,'notes'),folderId,isDraft:false,pendingBackup:false,createdAt:textField(x,'createdAt',stamp()),updatedAt:textField(x,'updatedAt',stamp())};
 });return copy;
}
function migrateV7(data){
 if(!isRecord(data)||!isRecord(data.columns)||!isRecord(data.tasks)||(data.columnOrder!==undefined&&!Array.isArray(data.columnOrder)))throw Error('不是支援的 v7.x HTML 資料');
 const folders=[],items=[],found=new Set(),ids=[...new Set(['col-uncategorized',...(data.columnOrder||[]),...Object.keys(data.columns)])];

  $('backupCancel').onclick=closeModal;$('backupConfirm').onclick=()=>{const saved=pendingSave;pendingSave=null;closeModal();if(saved)confirmBackup(saved)};
 }catch{if(vault===source&&sessionEpoch===session){notify('匯出失敗，未匯出提示保留');renderStatus()}}finally{exportBusy=false;$('exportBtn').disabled=$('htmlExportBtn').disabled=false}}
function exportCSV(){if(modeMobile()||!pendingCheck())return;openModal(`<h2>Excel／CSV 明文匯出</h2><p class="bad">注意：CSV 沒有加密，可能暴露帳號與密碼。僅在確實需要時使用，切勿上傳 GitHub。</p><label style="display:flex;align-items:center;gap:9px"><input type="checkbox" id="csvPasswords" style="width:auto;min-height:auto">包含密碼欄位（預設不包含）</label><div class="form-actions"><button id="csvCancel" class="btn">取消</button><button id="csvConfirm" class="btn warn">匯出 CSV</button></div>`);$('csvCancel').onclick=closeModal;$('csvConfirm').onclick=()=>{const include=$('csvPasswords').checked;if(include&&!confirm('CSV 內含明文密碼，確定匯出？'))return;
 const cell=v=>{let s=String(v??'');if(/^[\s]*[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};const cols=['分類','標題','帳號',...(include?['密碼']:[]),'備註'];const rows=[cols,...vault.items.map(i=>[folderName(i.folderId),i.title,i.account,...(include?[i.password]:[]),i.notes])];const csv='\ufeff'+rows.map(row=>row.map(cell).join(',')).join('\r\n');download(new Blob([csv],{type:'text/csv;charset=utf-8'}),`PassVault_${fileStamp()}.csv`);closeModal();notify('已匯出 CSV（不加密）')}}
async function handleTxt(files){if(modeMobile()||!vault)return;const source=vault,session=sessionEpoch;try{let all=[];for(const f of files){if(!f.name.toLowerCase().endsWith('.txt'))continue;const blocks=(await f.text()).replace(/\r\n/g,'\n').split(/\n[ \t]*\n/);for(const block of blocks){const lines=block.replace(/^\n+|\n+$/g,'').split('\n');if(!lines[0]?.trim())continue;all.push({id:uid(),title:lines[0].trim(),account:lines[1]||'',password:lines[2]||'',notes:lines.slice(3).join('\n'),folderId:'uncategorized',pendingBackup:true,isDraft:false,createdAt:stamp(),updatedAt:stamp()})}}
 if(vault!==source||sessionEpoch!==session)return;if(!all.length)return notify('沒有找到可匯入的 TXT 帳密');if(!confirm(`從 TXT 新增 ${all.length} 筆至「未分類」？`))return;vault.items.unshift(...all);markChange();renderAll();notify('TXT 匯入完成，尚未匯出')}catch{if(vault===source&&sessionEpoch===session)notify('TXT 讀取失敗，原資料未變更')}}
async function handleVaultInput(file){const session=++sessionEpoch;incoming=null;try{const p=validatePayload(JSON.parse(await file.text()));if(session!==sessionEpoch)return;incoming=p;selectedFilename=file.name;$('unlockArea').classList.remove('hidden');$('masterInput').value='';statusText(`已選擇：${file.name}`);$('masterInput').focus()}catch{if(session===sessionEpoch){incoming=null;statusText('讀取失敗：格式不支援或檔案已損毀',true)}}}
async function handleHTMLInput(file){if(vault&&!confirm('讀取另一份 HTML 會取代目前開啟的密碼庫。請確認已匯出最新修改。繼續嗎？'))return;const session=++sessionEpoch;incoming=null;try{const template=document.createElement('template');template.innerHTML=await file.text();if(session!==sessionEpoch)return;const doc=template.content,ciphers=doc.querySelectorAll('#embedded-vault'),legacies=doc.querySelectorAll('#embedded-data');if(ciphers.length>1||legacies.length>1)throw Error('備份節點不唯一');const cipher=ciphers[0];if(cipher?.textContent?.trim()){const p=validatePayload(JSON.parse(cipher.textContent));if(vault)lockForced();incoming=p;selectedFilename=file.name;$('unlockArea').classList.remove('hidden');$('masterInput').value='';statusText('已載入加密 HTML，請輸入主密碼');$('masterInput').focus();return}
 const legacy=legacies[0];if(!legacy?.textContent?.trim())throw Error('未發現可匯入的密碼庫');const data=JSON.parse(legacy.textContent),converted=migrateV7(data);const original=Object.keys(data.tasks||{}).length;
 openModal(`<h2>舊 HTML 匯入分析</h2><p>原有帳密：${original} 筆<br>可轉換帳密：${converted.items.length} 筆<br>資料夾：${converted.folders.length} 個</p><p class="small">不會修改來源檔案。匯入後請建立新的加密 .pvault 備份。</p><div class="form-actions"><button class="btn" id="legacyCancel">取消</button><button class="btn primary" id="legacyOK">確認匯入</button></div>`);$('legacyCancel').onclick=closeModal;$('legacyOK').onclick=()=>{if(sessionEpoch!==session)return;if(original!==converted.items.length)return alert('筆數不一致，請先檢查來源檔');sessionEpoch++;vault=converted;masterPassword='';selectedFilename=file.name;dirty=true;postExport=false;closeModal();showApp();notify('舊版已轉換，請匯出加密備份')};
 }catch{if(session===sessionEpoch){const message='HTML 匯入失敗：格式不支援、索引不完整或備份節點重複，原資料未變更';statusText(message,true);if(vault)notify(message)}}}
async function unlockNow(){const password=$('masterInput').value;if(!password)return statusText('請先輸入主密碼',true);const session=++sessionEpoch,payload=incoming;try{const decoded=normalize(await decrypt(payload,password));if(session!==sessionEpoch)return;vault=decoded;masterPassword=modeMobile()?'':password;$('masterInput').value='';incoming=null;dirty=false;postExport=false;changedSinceOpen=false;showApp()}catch{if(session===sessionEpoch)statusText('主密碼不正確、檔案損毀或格式不支援',true)}}
function beginBackground(){hideReveal();if(!modeMobile()||!vault)return;if(hiddenAt===null)hiddenAt=Date.now();clearTimeout(backgroundTimer);backgroundTimer=setTimeout(()=>{if(vault&&hiddenAt!==null&&Date.now()-hiddenAt>=30000){lockForced();statusText('已自動鎖定，請重新開啟密碼庫')}},Math.max(0,30000-(Date.now()-hiddenAt)))}
function resumeBackground(){clearTimeout(backgroundTimer);backgroundTimer=null;const expired=hiddenAt!==null&&Date.now()-hiddenAt>=30000;hiddenAt=null;if(expired&&modeMobile()&&vault){lockForced();statusText('已自動鎖定，請重新開啟密碼庫')}}
function returnFolders(){$('search').value='';currentFolder='all';selectedId=null;hideReveal();setTab('folders');renderMobile()}
function install(){document.body.classList.toggle('mobile-mode',modeMobile());$('newVault').classList.toggle('hidden',modeMobile());setVersion();$('vaultInput').onchange=e=>{const f=e.target.files[0];if(f)handleVaultInput(f);e.target.value=''};$('htmlInput').onchange=e=>{const f=e.target.files[0];if(f)handleHTMLInput(f);e.target.value=''};$('htmlInputPC').onchange=e=>{const f=e.target.files[0];if(f)handleHTMLInput(f);e.target.value=''};$('unlockBtn').onclick=unlockNow;$('masterInput').onkeydown=e=>{if(e.key==='Enter')unlockNow()};$('newVault').onclick=()=>{if(modeMobile())return;sessionEpoch++;incoming=null;$('masterInput').value='';vault=normalize(emptyVault());masterPassword='';selectedFilename='新密碼庫';dirty=true;postExport=false;showApp()};$('lockBtn').onclick=lock;
 $('addItem').onclick=showNewItem;$('addFolder').onclick=showNewFolder;$('exportBtn').onclick=()=>exportBackup(false);$('htmlExportBtn').onclick=()=>exportBackup(true);$('csvBtn').onclick=exportCSV;$('txtInput').onchange=e=>{handleTxt([...e.target.files]);e.target.value=''};$('search').oninput=()=>{if(modeMobile())setTab('list');renderAll()};$('backBtn').onclick=returnFolders;
 $('uncatColumn').addEventListener('dragover',e=>{if(drag?.kind==='item')e.preventDefault()});$('uncatColumn').addEventListener('drop',e=>{if(drag?.kind==='item'){e.preventDefault();moveItem(drag.id,'uncategorized')}});
 document.querySelectorAll('.mobile-tabs button').forEach(b=>b.onclick=()=>{if(b.dataset.tab!=='detail')hideReveal();setTab(b.dataset.tab)});$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};
 document.addEventListener('visibilitychange',()=>{document.hidden?beginBackground():resumeBackground()});window.addEventListener('pagehide',beginBackground);window.addEventListener('pageshow',resumeBackground);window.addEventListener('focus',()=>{if(!document.hidden)resumeBackground()});
 window.addEventListener('beforeunload',e=>{if((dirty||draft)&&!modeMobile()){e.preventDefault();e.returnValue=''}});
 const embedded=$('embedded-vault').textContent.trim();if(embedded){try{incoming=validatePayload(JSON.parse(embedded));$('unlockArea').classList.remove('hidden');statusText('已找到此 HTML 的加密密碼庫，輸入主密碼即可開啟');$('masterInput').focus()}catch{incoming=null;statusText('HTML 內的加密備份格式有誤',true)}}
}
install();
