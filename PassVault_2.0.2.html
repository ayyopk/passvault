<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08111f">
  <title>PassVault</title>
  <style>
    :root{
      --bg:#08111f;--panel:#101b2d;--panel2:#142238;--line:#263750;
      --text:#f4f7fb;--muted:#8ea1bb;--green:#36d399;--green2:#19b97f;
      --red:#fb7185;--yellow:#fbbf24;--blue:#60a5fa;--radius:16px;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;background:linear-gradient(145deg,#07101d,#0e1c2f);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif}
    button,input,textarea,select{font:inherit}
    button{cursor:pointer}
    .hidden{display:none!important}
    .app{min-height:100vh;display:flex;flex-direction:column}
    .topbar{height:68px;padding:0 20px;display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--line);
      background:rgba(8,17,31,.92);backdrop-filter:blur(14px);position:sticky;top:0;z-index:20}
    .brand{font-weight:800;font-size:20px;white-space:nowrap;display:flex;align-items:baseline;gap:7px}
    .brand>span{color:var(--text)}.brand-version{color:var(--green);font-size:14px;font-weight:850}
    .version{font-size:12px;color:var(--muted);margin-left:3px}
    .search-wrap{flex:1;max-width:620px;position:relative}
    .search{width:100%;height:42px;border-radius:12px;border:1px solid var(--line);background:#0c1727;color:var(--text);
      padding:0 14px 0 40px;outline:none;font-size:15px}
    .search:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(54,211,153,.14)}
    .search-icon{position:absolute;left:14px;top:11px;color:var(--muted)}
    .search-back{display:none;position:absolute;border:1px solid #315272;background:#142943;color:#dfffee;
      align-items:center;justify-content:center;border-radius:11px;padding:0}
    .search-back:hover{background:#1b3856;border-color:var(--green)}
    .return-arrow-icon{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    .top-actions{margin-left:auto;display:flex;gap:8px}
    .btn{height:40px;border-radius:10px;border:1px solid var(--line);padding:0 14px;background:#122138;color:var(--text)}
    .btn:hover{background:#172943}.btn.primary{background:var(--green);border-color:var(--green);color:#052e23;font-weight:800}
    .btn.primary:hover{background:var(--green2)}.btn.danger{color:#fecdd3}.btn.ghost{background:transparent}
    .layout{display:grid;grid-template-columns:230px minmax(280px,1fr) minmax(320px,430px);gap:14px;padding:14px;flex:1;min-height:0}
    .panel{background:rgba(16,27,45,.88);border:1px solid var(--line);border-radius:var(--radius);min-height:0;overflow:hidden}
    .sidebar{display:flex;flex-direction:column}.panel-head{padding:16px;border-bottom:1px solid var(--line);font-weight:700}
    .folders{padding:10px;overflow:auto;flex:1}.folder{width:100%;border:none;background:transparent;color:var(--text);display:flex;
      align-items:center;justify-content:space-between;padding:11px 12px;border-radius:10px;text-align:left}
    .folder:hover,.folder.active{background:#192943}.folder small{color:var(--muted)}
    .pending-dot,.pending-item-label{display:inline-block;background:var(--yellow);color:#332600;border-radius:999px;font-size:10px;font-weight:900;padding:2px 6px;vertical-align:middle;margin-left:5px}
    .folder.has-new{background:rgba(251,191,36,.13);border:1px solid rgba(251,191,36,.62);color:#fff4c2}
    .folder.has-new small{color:#fcd34d;font-weight:800}
    .vault-status{margin:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#0d192a}
    .vault-status-label{font-size:11px;color:var(--muted);margin-bottom:5px}.vault-status-name{font-size:13px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:10px}
    .vault-status-row{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted);margin-top:7px}.vault-status-row b{color:#c9d7e8;font-weight:700;text-align:right}
    .vault-status-row b.unsaved{color:var(--yellow)}.vault-status-row b.saved{color:#86efac}
    .list-panel{display:flex;flex-direction:column}.toolbar{padding:12px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
    .status{font-size:12px;color:var(--muted);margin-left:auto}.items{overflow:auto;padding:10px}
    .item{border:1px solid transparent;border-radius:12px;padding:13px;margin-bottom:8px;background:#111f33;display:flex;gap:12px;align-items:center}
    .item:hover,.item.active{border-color:#36506e;background:#162741}
    .item.is-new-unsaved{border-color:rgba(251,191,36,.72);background:rgba(251,191,36,.12);box-shadow:inset 4px 0 0 #fbbf24}
    .item.is-new-unsaved .icon{background:rgba(251,191,36,.22);color:#fde68a}
    .item .icon{width:38px;height:38px;border-radius:10px;background:#20334f;
      display:grid;place-items:center;font-weight:800}.item-main{min-width:0;flex:1}.item-title{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .item-sub{font-size:12px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    mark{background:rgba(251,191,36,.28);color:#fff3c4;padding:0 .12em;border-radius:4px}
    .complete-btn{color:#2d2300;background:var(--yellow);border-color:var(--yellow);font-weight:900}
    .complete-btn:hover{background:#f59e0b;border-color:#f59e0b}
    .draft-note{margin:0 0 18px;padding:12px 14px;border-radius:12px;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.48);color:#fde68a;font-size:13px;line-height:1.55}
    .draft-actions{display:flex;gap:10px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
    .draft-complete{flex:1;height:48px;border:1px solid var(--yellow);border-radius:12px;background:var(--yellow);color:#2d2300;font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
    .draft-complete:hover{background:#f59e0b;border-color:#f59e0b}
    .draft-cancel{height:48px;padding:0 18px;border:1px solid var(--line);border-radius:12px;background:#13223a;color:var(--text);font-weight:700}
    .draft-cancel:hover{background:#1b2d47}
    .detail{display:flex;flex-direction:column}.detail-body{padding:18px;overflow:auto}.detail-empty{height:100%;display:grid;place-items:center;color:var(--muted);text-align:center;padding:30px}
    .detail-title-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:20px}.detail-title{font-size:22px;font-weight:800;flex:1}
    .field{margin-bottom:14px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:7px}
    .value-row{display:flex;gap:8px}.value,.edit-input,.edit-textarea,.edit-select{width:100%;min-height:44px;border-radius:10px;border:1px solid var(--line);
      background:#0d192a;color:var(--text);padding:11px 12px;overflow-wrap:anywhere}
    .value.mono,.edit-input.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.edit-textarea{min-height:100px;resize:vertical}
    .icon-btn{width:42px;min-width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:#13223a;color:var(--text)}
    .meta{font-size:12px;color:var(--muted);margin-top:18px;line-height:1.7}
    .notice{margin:14px;padding:12px 14px;border:1px solid #315272;background:#10243a;border-radius:12px;color:#c9d7e8;font-size:13px}
    .login{min-height:100vh;display:grid;place-items:center;padding:24px}
    .login-card{width:min(460px,100%);background:rgba(16,27,45,.95);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
    .login-brand{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}.login h1{margin:0}.login-version{color:var(--green);font-size:18px;font-weight:850}
    .login p{color:var(--muted);line-height:1.6}.login-actions{display:grid;gap:10px;margin-top:20px}
    .release-note{margin-top:18px;border-top:1px solid var(--line);padding-top:14px;color:var(--muted)}
    .release-note summary{cursor:pointer;font-size:13px;font-weight:750;color:#c8d6e8}
    .release-content{display:grid;gap:7px;margin-top:12px;font-size:12px}.release-content b{color:var(--text)}
    .file-label{display:flex;align-items:center;justify-content:center;height:46px;border:1px dashed #3b5573;border-radius:12px;background:#102039;cursor:pointer}
    .file-label:hover{border-color:var(--green)}.file-label input{display:none}
    .pass-row{display:flex;gap:8px;margin-top:12px}.pass-row input{flex:1;height:44px;border:1px solid var(--line);border-radius:10px;background:#0b1727;color:var(--text);padding:0 12px}
    .small{font-size:12px;color:var(--muted)}.danger-text{color:#fecdd3}.good-text{color:#86efac}
    .floating-toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,18px);opacity:0;pointer-events:none;
      background:#f4f7fb;color:#08111f;padding:10px 18px;border-radius:999px;font-weight:750;z-index:200;
      box-shadow:0 12px 30px rgba(0,0,0,.38);transition:.22s ease;white-space:nowrap}
    .floating-toast.show{opacity:1;transform:translate(-50%,0)}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.68);display:grid;place-items:center;padding:20px;z-index:100}
    .modal-card{width:min(520px,100%);max-height:90vh;overflow:auto;background:#101b2d;border:1px solid var(--line);border-radius:18px;padding:22px}
    .modal-card h2{margin-top:0}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
    .report{background:#0d192a;border:1px solid var(--line);border-radius:12px;padding:12px;line-height:1.8}
    .mobile-tabbar{display:none}
    /* 小視窗與手機共用一套版面，唯讀政策獨立判斷。 */
.compact-layout .topbar{height:auto;flex-wrap:wrap;padding:14px}
.compact-layout .brand{width:100%;font-size:24px}
.compact-layout .search-wrap{order:3;max-width:none;width:100%}
.compact-layout .top-actions{position:absolute;right:12px;top:14px}
.compact-layout .search{height:56px;border-radius:16px;padding:0 62px 0 48px;font-size:22px}
.compact-layout .search-icon{left:16px;top:17px;font-size:22px}
.compact-layout .search-back{display:flex;right:7px;top:7px;width:46px;height:42px}
.compact-layout .layout{grid-template-columns:1fr;padding:10px;padding-bottom:82px}
.compact-layout .sidebar,.compact-layout .detail{display:none}
.compact-layout .layout.show-folders .sidebar{display:flex}
.compact-layout .layout.show-folders .list-panel{display:none}
.compact-layout .layout.show-detail .list-panel{display:none}
.compact-layout .layout.show-detail .detail{display:flex}
.compact-layout .panel{border-radius:14px}
.compact-layout .toolbar .desktop-only,.compact-layout .vault-status.desktop-only{display:none!important}
.compact-layout .toolbar{padding:14px}
.compact-layout .btn{height:44px;font-size:16px}
.compact-layout .status{font-size:15px}
.compact-layout .items{padding:12px}
.compact-layout .item{padding:16px 14px;margin-bottom:10px;border-radius:14px}
.compact-layout .item .icon{width:44px;height:44px;font-size:19px}
.compact-layout .item-title{font-size:24px}
.compact-layout .item-sub{font-size:17px;line-height:1.35;margin-top:6px}
.compact-layout .folder{padding:14px 12px;font-size:18px}
.compact-layout .panel-head{font-size:18px}
.compact-layout .detail-title{font-size:28px}
.compact-layout .field label{font-size:14px}
.compact-layout .value,.compact-layout .edit-input,.compact-layout .edit-textarea,.compact-layout .edit-select{font-size:20px;min-height:52px}
.compact-layout .meta{font-size:14px}
.compact-layout .notice{margin:10px;font-size:15px}
.compact-layout .mobile-tabbar{display:grid;grid-template-columns:repeat(3,1fr);position:fixed;bottom:0;left:0;right:0;height:72px;background:#091525;border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.compact-layout .mobile-tabbar button{border:none;background:transparent;color:var(--muted);font-size:14px}
.compact-layout .mobile-tabbar button.active{color:var(--green)}
.compact-layout .detail-body{padding:16px}
</style>
</head>
<body>
<div id="login" class="login">
  <div class="login-card">
    <div class="login-brand"><h1>PassVault</h1><span class="login-version" id="loginVersion"></span></div>
    <p id="startupNotice" class="small danger-text" role="alert">程式尚未載入。若按鈕沒有反應，請改用新版單檔 HTML，或透過本機預覽／GitHub Pages 開啟。</p>
    <p>電腦可編輯、手機唯讀。密碼庫以 AES-GCM 加密後存放在你的 iCloud Drive；GitHub Pages 只放程式，不放密碼。</p>
    <div class="login-actions">
      <label class="file-label">開啟加密密碼庫（.pvault）
        <input id="vaultFile" type="file" accept=".pvault,application/json">
      </label>
      <label class="file-label">匯入 .HTML
        <input id="legacyFile" type="file" accept=".html,text/html">
      </label>
      <button id="newVaultBtn" class="btn ghost">建立新的空白密碼庫</button>
    </div>
    <div id="unlockBox" class="hidden">
      <div class="pass-row">
        <input id="masterPassword" type="password" placeholder="輸入主密碼">
        <button id="unlockBtn" class="btn primary">解鎖</button>
      </div>
    </div>
    <p id="loginMsg" class="small" role="status" aria-live="polite"></p>
    <p class="small">提醒：主密碼不會儲存在檔案中，忘記後無法復原。</p>
    <details class="release-note">
      <summary>版本資訊</summary>
      <div class="release-content">
        <b id="releaseVersion"></b>
        <span>✓ 電腦草稿與完成新增流程</span>
        <span>✓ 手機唯讀與跨分類搜尋</span>
        <span>✓ 黃色未備份提示</span>
        <span>✓ AES-GCM 加密 .pvault</span>
        <span>✓ 舊版 HTML 匯入檢查</span>
      </div>
    </details>
  </div>
</div>

<div id="app" class="app hidden">
  <header class="topbar">
    <div class="brand"><span>PassVault</span><small class="brand-version" id="appVersion"></small><small class="version" id="modeLabel"></small></div>
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input id="searchInput" class="search" placeholder="搜尋標題、帳號、備註">
      <button id="backToFoldersBtn" class="search-back" type="button" aria-label="返回上一層" title="返回上一層">
        <svg class="return-arrow-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15 5 8 12l7 7"></path>
        </svg>
      </button>
    </div>
    <div class="top-actions">
      <button id="addBtn" class="btn primary desktop-only">＋ 新增</button>
      <button id="saveBtn" class="btn desktop-only">匯出備份</button>
      <button id="lockBtn" class="btn ghost">鎖定</button>
    </div>
  </header>

  <main id="layout" class="layout">
    <aside class="panel sidebar">
      <div class="panel-head">分類</div>
      <div id="folders" class="folders"></div>
      <div class="vault-status desktop-only">
        <div class="vault-status-label">目前密碼庫</div>
        <div class="vault-status-name" id="vaultFileName">尚未命名</div>
        <div class="vault-status-row"><span>最後更新</span><b id="vaultUpdatedAt">—</b></div>
        <div class="vault-status-row"><span>備份狀態</span><b id="backupState">—</b></div>
      </div>
    </aside>

    <section class="panel list-panel">
      <div class="toolbar">
        <button id="allFilter" class="btn">全部</button>
        <span id="countStatus" class="status"></span>
      </div>
      <div id="items" class="items"></div>
    </section>

    <section class="panel detail">
      <div id="detailBody" class="detail-body">
        <div class="detail-empty">選擇一筆帳號<br>即可查看詳細內容</div>
      </div>
    </section>
  </main>

  <nav class="mobile-tabbar">
    <button data-tab="folders">分類</button>
    <button data-tab="list">帳號</button>
    <button data-tab="detail">詳細</button>
  </nav>
</div>

<div id="modal" class="modal hidden"><div class="modal-card" id="modalCard"></div></div>

<script>
(()=>{
'use strict';
const APP_VERSION = '2.0.2';
const SCHEMA_VERSION = 1;

const nowIso = () => new Date().toISOString();
const uid = () => crypto.randomUUID();
const record = x => x !== null && typeof x === 'object' && !Array.isArray(x);
const text = (x, key, fallback = '') => {
  if (x[key] === undefined) return fallback;
  if (typeof x[key] !== 'string') throw new Error(`欄位 ${key} 必須是文字`);
  return x[key];
};
function emptyVault() {
  return { schemaVersion: SCHEMA_VERSION, appVersion: APP_VERSION, createdAt: nowIso(), updatedAt: nowIso(), folders: [{ id: 'personal', name: '個人帳號' }, { id: 'work', name: '工作帳號' }, { id: 'finance', name: '金融服務' }], items: [] };
}
function normalizeVault(v) {
  if (!record(v) || v.schemaVersion !== SCHEMA_VERSION || !Array.isArray(v.folders) || !Array.isArray(v.items)) throw new Error('密碼庫結構或版本錯誤');
  const folderIds = new Set(), itemIds = new Set();
  const folders = v.folders.map(f => {
    if (!record(f) || !text(f, 'id') || f.id === 'all' || folderIds.has(f.id)) throw new Error('分類 ID 缺少、重複或保留');
    folderIds.add(f.id);
    return { ...f, id: f.id, name: text(f, 'name') };
  });
  const items = v.items.map(x => {
    if (!record(x) || !text(x, 'id') || itemIds.has(x.id)) throw new Error('帳密 ID 缺少或重複');
    itemIds.add(x.id);
    const folderId = text(x, 'folderId');
    if (!folderIds.has(folderId)) throw new Error('帳密指向不存在的分類');
    if (x.isDraft === true) throw new Error('匯入檔案含未完成草稿');
    return { ...x, id: x.id, title: text(x, 'title'), account: text(x, 'account'), password: text(x, 'password'), notes: text(x, 'notes'), folderId, isDraft: false, pendingBackup: false, createdAt: text(x, 'createdAt', nowIso()), updatedAt: text(x, 'updatedAt', nowIso()) };
  });
  return { ...v, schemaVersion: SCHEMA_VERSION, appVersion: APP_VERSION, folders, items };
}
// 比較正式資料；草稿、提示及時間戳不是已完成帳密的內容。
function contentSnapshot(v) {
  return JSON.stringify({ folders: v.folders, items: v.items.filter(i => !i.isDraft).map(({ isDraft, pendingBackup, createdAt, updatedAt, ...i }) => i) });
}
function addDraft(v, folderId) {
  const i = { id: uid(), title: '', account: '', password: '', notes: '', folderId, isDraft: true, pendingBackup: false, createdAt: nowIso(), updatedAt: nowIso() };
  v.items.unshift(i);
  return i;
}
function updateItem(v, i, field, value) {
  if (!['title', 'account', 'password', 'notes', 'folderId'].includes(field)) throw new Error('不支援的欄位');
  if (field === 'folderId' && !v.folders.some(f => f.id === value)) throw new Error('分類不存在');
  if (i[field] === value) return;
  i[field] = value;
  i.updatedAt = nowIso();
  if (!i.isDraft) v.updatedAt = i.updatedAt;
}
function completeDraft(v, i) {
  if (!i.isDraft || !i.title.trim() || !i.account.trim() || !i.password || !v.folders.some(f => f.id === i.folderId)) throw new Error('請填寫標題、帳號、密碼並選擇分類');
  i.isDraft = false;
  i.pendingBackup = true;
  i.updatedAt = v.updatedAt = nowIso();
}
function removeItem(v, id) {
  const item = v.items.find(i => i.id === id);
  v.items = v.items.filter(i => i.id !== id);
  if (item && !item.isDraft) v.updatedAt = nowIso();
}
function convertLegacy(appData) {
  if (!record(appData) || !record(appData.columns) || !record(appData.tasks) || (appData.columnOrder !== undefined && !Array.isArray(appData.columnOrder))) throw new Error('舊資料結構不完整');
  const tasks = appData.tasks, folders = [], items = [], seen = new Set();
  const order = [...new Set(['col-uncategorized', ...(appData.columnOrder || []), ...Object.keys(appData.columns)])];
  for (const cid of order) {
    if (typeof cid !== 'string') throw new Error('分類順序格式錯誤');
    const c = appData.columns[cid];
    if (c === undefined && cid === 'col-uncategorized') continue;
    if (!record(c) || (c.taskIds !== undefined && !Array.isArray(c.taskIds))) throw new Error('分類或帳密索引錯誤');
    const fid = cid === 'col-uncategorized' ? 'uncategorized' : cid;
    folders.push({ id: fid, name: text(c, 'title', '未命名分類') });
    for (const key of c.taskIds || []) {
      if (typeof key !== 'string' || !Object.hasOwn(tasks, key) || seen.has(key)) throw new Error('舊帳密索引遺失或重複');
      seen.add(key);
      items.push(convertTask(tasks[key], key, fid));
    }
  }
  for (const [key, t] of Object.entries(tasks)) {
    if (!seen.has(key)) items.push(convertTask(t, key, 'uncategorized'));
  }
  if (!folders.some(f => f.id === 'uncategorized')) folders.unshift({ id: 'uncategorized', name: '未分類' });

const encoder = new TextEncoder();
const decoder = new TextDecoder('utf-8', { fatal: true });
const bytesToB64 = bytes => btoa(Array.from(bytes, b => String.fromCharCode(b)).join(''));
const b64ToBytes = s => {

  const iterations = p.iterations === undefined ? 250000 : p.iterations;
  if (!Number.isSafeInteger(iterations) || iterations < 1 || iterations > 2000000) throw new Error('無效的 KDF 參數');
  if (b64ToBytes(p.salt).length !== 16 || b64ToBytes(p.iv).length !== 12 || b64ToBytes(p.data).length < 16) throw new Error('加密資料長度錯誤');

}
async function deriveKey(password, salt, iterations = 250000) {

  const cipher = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, encoder.encode(JSON.stringify(data))));
  return { format: 'passvault', schemaVersion: SCHEMA_VERSION, appVersion: APP_VERSION, kdf: 'PBKDF2-SHA256', iterations, cipher: 'AES-GCM', salt: bytesToB64(salt), iv: bytesToB64(iv), data: bytesToB64(cipher) };

function createBackgroundLock({ lock, active, now = Date.now, schedule = setTimeout, cancel = clearTimeout }) {
  let hiddenAt = null, timer = null;
  const clear = () => { if (timer !== null) cancel(timer); timer = null; };
  return {
    hide() {
      if (!active()) return;
      if (hiddenAt === null) hiddenAt = now();
      clear();
      timer = schedule(() => { if (active() && hiddenAt !== null && now() - hiddenAt >= BACKGROUND_LOCK_MS) { hiddenAt = null; lock(); } }, Math.max(0, BACKGROUND_LOCK_MS - (now() - hiddenAt)));
    },
    resume() {
      clear();
      const expired = hiddenAt !== null && now() - hiddenAt >= BACKGROUND_LOCK_MS;
      hiddenAt = null;
      if (active() && expired) lock();
    },
    reset() { clear(); hiddenAt = null; }
  };
}

async function doExport(){

    }
    if(session!==sessionEpoch||!vault)return;
    const exported=prepareExport(vault);
    const payload=await encryptVault(exported.data,masterKeyPassword);
    if(session!==sessionEpoch||!vault)return;
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});

      const stream=await fileHandle.createWritable();
      try{await stream.write(blob);await stream.close()}catch(e){try{await stream.abort()}catch{}throw e}

      exportPending={exported,filename,session};
      openModal('<h2>確認下載結果</h2><p class="small">已啟動下載。請先確認加密檔案已儲存；接著仍須手動放入 iCloud Drive。</p><div class="modal-actions"><button class="btn" id="downloadFailed">未儲存／取消</button><button class="btn primary" id="downloadSaved">已儲存下載檔</button></div>');

      };
    }
  }catch(e){if(session===sessionEpoch&&vault){render();toast(e.name==="AbortError"?"已取消匯出，尚未備份提示保留":"匯出失敗，尚未備份提示保留")}}

}
function finishExport(exported,filename){
  acknowledgeExport(vault,exported);baseline=exported.snapshot;currentVaultName=filename;backupLabel="已確認匯出";render();
  toast(dirty?"已匯出；之後的修改仍未備份":"已確認匯出；請手動放入 iCloud");
}
async function handleVaultFile(file){
  const session=++sessionEpoch;unlockPayload=null;$("#unlockBox").classList.remove("hidden");$("#masterPassword").value="";
  try{
    const payload=await readEncryptedFile(file);
    if(session!==sessionEpoch)return;unlockPayload=payload;
    currentVaultName=file.name;
    $("#unlockBox").classList.remove("hidden");setMsg(`已選擇：${file.name}`,"good");$("#masterPassword").focus();
  }catch{if(session===sessionEpoch){unlockPayload=null;setMsg("這不是有效或支援的 .pvault 檔案","bad")}}
}
async function handleLegacyFile(file){
  const session=++sessionEpoch;unlockPayload=null;
  closeModal();$("#unlockBox").classList.add("hidden");setMsg("正在讀取舊版 HTML…");
  try{
    const {converted,oldCount}=await readLegacyFile(file);if(session!==sessionEpoch)return;
    currentVaultName=file.name;
    const newCount=converted.items.length;
    openModal(`<h2>HTML 匯入分析</h2><div class="report">舊版帳密：${oldCount} 筆<br>新版帳密：${newCount} 筆<br>分類：${converted.folders.length} 個<br>遺失：${Math.max(0,oldCount-newCount)} 筆</div>
    <p class="small">原始 HTML 不會被修改。確認後只會在瀏覽器記憶體中開啟，之後請匯出新的加密 .pvault。</p>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button id="acceptLegacy" class="btn primary">確認轉換並開啟</button></div>`);
    $("#acceptLegacy").onclick=()=>{vault=converted;baseline=null;masterKeyPassword="";dirty=true;closeModal();showApp()};
  }catch(error){if(session===sessionEpoch)setMsg(legacyImportMessage(error),"bad")}
}
$("#vaultFile").onchange=e=>{const file=e.target.files[0];e.target.value="";if(file)handleVaultFile(file)};
$("#legacyFile").onchange=e=>{const file=e.target.files[0];e.target.value="";if(file)handleLegacyFile(file)};
$("#unlockBtn").onclick=async()=>{
  const p=$("#masterPassword").value;if(!p)return setMsg("請輸入主密碼","bad");
  const session=++sessionEpoch,payload=unlockPayload;
  try{const decoded=normalizeVault(await decryptVault(payload,p));if(session!==sessionEpoch)return;vault=decoded;baseline=contentSnapshot(vault);backupLabel="已開啟既有備份";masterKeyPassword=readonlyMode?"":p;$("#masterPassword").value="";unlockPayload=null;dirty=false;showApp()}
  catch{if(session===sessionEpoch)setMsg("主密碼錯誤，或檔案結構不完整／已損毀","bad")}
};
$("#masterPassword").onkeydown=e=>e.key==="Enter"&&$("#unlockBtn").click();
$("#newVaultBtn").onclick=()=>{if(readonlyMode)return;sessionEpoch++;baseline=null;vault=emptyVault();masterKeyPassword="";currentVaultName="新的密碼庫";dirty=true;showApp()};
$("#searchInput").oninput=()=>{ if(readonlyMode) mobileTab("list"); render(); };
$("#backToFoldersBtn").onclick=()=>{
  $("#searchInput").value="";
  currentFolder="all";
  selectedId=null;
  mobileTab("folders");
  render();
};
$("#allFilter").onclick=()=>{currentFolder="all";render()};
$("#addBtn").onclick=addItem;$("#saveBtn").onclick=exportVault;$("#lockBtn").onclick=()=>{if((dirty||vault?.items.some(i=>i.isDraft))&&!confirm("尚未匯出最新修改，仍要鎖定嗎？"))return;lockApp()};
$$(".mobile-tabbar button").forEach(b=>b.onclick=()=>mobileTab(b.dataset.tab));
$("#modal").onclick=e=>{if(e.target===$("#modal")){exportPending=null;closeModal()}};
const backgroundLock=createBackgroundLock({lock:lockApp,active:()=>readonlyMode&&!!vault});
document.addEventListener("visibilitychange",()=>{document.hidden?backgroundLock.hide():backgroundLock.resume()});
window.addEventListener("pagehide",()=>backgroundLock.hide());
window.addEventListener("pageshow",()=>backgroundLock.resume());
window.addEventListener("focus",()=>{if(!document.hidden)backgroundLock.resume()});
window.addEventListener("beforeunload",e=>{if((dirty||vault?.items.some(i=>i.isDraft))&&!readonlyMode){e.preventDefault();e.returnValue=""}});
window.closeModal=closeModal;

$("#newVaultBtn").classList.toggle("hidden",readonlyMode);
$("#startupNotice").classList.add("hidden");

})();
</script>
</body>
</html>
